# Render Blueprint — Static Site for the public knowledge-graph viewer.
# Privacy: deploy/index.html is generated locally by build_viewer.py
# --public-only, which strips all private/quarantined material and
# FAILS the build if its leak scan finds any private node ID or label
# in the output. The HTML travels in two chunks under viewer-parts/
# (host upload size limits) and the build command reassembles it
# byte-identically before publishing.
services:
  - type: web
    name: knowledge-graph
    env: static
    buildCommand: mkdir -p deploy && cat viewer-parts/index.html.aa viewer-parts/index.html.ab > deploy/index.html
    staticPublishPath: deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
